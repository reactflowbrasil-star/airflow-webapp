# PostgreSQL para rodar o AirFlow no próprio computador — ver docs/LOCAL.md.
#
#   docker compose up -d      sobe o banco (os dados ficam no volume)
#   docker compose stop       para sem apagar nada
#   docker compose down -v    apaga o banco inteiro
#
# Credenciais fixas e fracas de propósito: são as mesmas do DATABASE_URL que o
# `pnpm local:preparar` grava no .env. Por isso a porta só escuta em 127.0.0.1
# — outro aparelho da rede não alcança este banco.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      # AIRFLOW_DB_PORTA troca a porta quando a 5432 já está ocupada (um
      # PostgreSQL instalado no próprio Windows, por exemplo).
      - "127.0.0.1:${AIRFLOW_DB_PORTA:-5432}:5432"
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  airflow-db:
